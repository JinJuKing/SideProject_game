<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideProject Game</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="top-bar">
        <label class="player-field">
          <span class="label">PLAYER</span>
          <input id="playerName" type="text" maxlength="50" value="guest" />
        </label>
        <div id="apiStatus" class="api-status">API 확인 중...</div>
      </section>

      <section class="hud" aria-label="game status">
        <div>
          <span class="label">TIME</span>
          <strong id="time">0.0</strong>
        </div>
        <div>
          <span class="label">BEST</span>
          <strong id="best">0.0</strong>
        </div>
        <div>
          <span class="label">LEVEL</span>
          <strong id="level">1</strong>
        </div>
      </section>

      <section class="game-layout">
        <canvas id="game" width="960" height="540" aria-label="dodging game"></canvas>

        <aside class="ranking-panel">
          <div class="ranking-header">
            <h2>랭킹</h2>
            <button id="refreshRankingButton" class="secondary-button" type="button">새로고침</button>
          </div>
          <ol id="rankingList" class="ranking-list">
            <li>서버가 켜지면 랭킹을 불러옵니다.</li>
          </ol>
        </aside>
      </section>

      <section class="controls">
        <button id="startButton" type="button">Start</button>
        <div>
          <p id="message">WASD로 이동하고 날아오는 탄을 최대한 오래 피하세요.</p>
          <p id="saveStatus" class="save-status">DB 서버가 켜져 있으면 결과가 자동 저장됩니다.</p>
        </div>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
