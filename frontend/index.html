<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideProject Game</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="top-bar">
        <div class="auth-panel">
          <label class="player-field">
            <span class="label">닉네임</span>
            <input id="playerName" type="text" maxlength="50" value="guest" />
          </label>
          <label class="player-field">
            <span class="label">비밀번호</span>
            <input id="playerPassword" type="password" maxlength="100" />
          </label>
          <button id="registerButton" class="secondary-button" type="button">가입</button>
          <button id="loginButton" class="secondary-button" type="button">로그인</button>
        </div>
        <div>
          <div id="apiStatus" class="api-status">API 확인 중...</div>
          <p id="authStatus" class="auth-status">로그인하면 최고 기록이 플레이어별로 갱신됩니다.</p>
        </div>
      </section>

      <section class="hud" aria-label="game status">
        <div>
          <span class="label">TIME</span>
          <strong id="time">0.0</strong>
        </div>
        <div>
          <span class="label">BEST</span>
          <strong id="best">0.0</strong>
        </div>
        <div>
          <span class="label">LEVEL</span>
          <strong id="level">1</strong>
        </div>
      </section>

      <section class="game-layout">
        <canvas id="game" width="960" height="540" aria-label="dodging game"></canvas>

        <aside class="ranking-panel">
          <div class="ranking-header">
            <h2>랭킹</h2>
            <button id="refreshRankingButton" class="secondary-button" type="button">새로고침</button>
          </div>
          <ol id="rankingList" class="ranking-list">
            <li>서버가 켜지면 랭킹을 불러옵니다.</li>
          </ol>
          <div class="feedback-panel">
            <h2>AI 피드백</h2>
            <p id="aiFeedback">Python AI 서버가 켜져 있으면 게임 종료 후 피드백을 보여줍니다.</p>
          </div>
        </aside>
      </section>

      <section class="controls">
        <button id="startButton" type="button" disabled>Start</button>
        <div>
          <p id="message">WASD로 이동하고 날아오는 탄을 최대한 오래 피하세요.</p>
          <p id="saveStatus" class="save-status">가입 또는 로그인 후 플레이할 수 있습니다.</p>
        </div>
      </section>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
