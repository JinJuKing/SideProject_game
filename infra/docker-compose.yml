services:
  postgres:
    image: postgres:16
    container_name: sideproject-game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sideproject_game
      POSTGRES_USER: sideproject
      POSTGRES_PASSWORD: sideproject1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sideproject -d sideproject_game"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
